<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTProto Checker</title>
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>

<div class="container">
    <div class="header-controls">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">
            <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <label class="sound-toggle" title="Sound on finish">
            <input type="checkbox" id="soundCheck">
            <span class="sound-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></span>
            <span class="sound-state" id="soundState">OFF</span>
        </label>
        <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
            <option value="fa">فارسی</option>
            <option value="en">English</option>
            <option value="ru">Русский</option>
            <option value="zh">中文</option>
        </select>
        <button class="help-btn" id="helpBtn" onclick="openHelp()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            <span data-i18n="helpBtn">راهنما</span>
        </button>
    </div>

    <div>
        <h1><a href="https://github.com/rahgozar94725/MTProto-Checker" target="_blank" rel="noopener" data-i18n="title">MTProto Checker</a></h1>
        <p class="sub" data-i18n="subtitle">تست اتصال</p>

        <div class="settings-bar">
            <div class="setting-item">
                <label data-i18n="concurrencyLabel">تعداد همزمان</label>
                <select id="concurrencySelect">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="50" selected>50</option>
                </select>
            </div>
            <div class="setting-item">
                <label data-i18n="timeoutLabel">تایم‌اوت (ثانیه)</label>
                <select id="timeoutSelect">
                    <option value="5" selected>5s</option>
                    <option value="8">8s</option>
                    <option value="10">10s</option>
                    <option value="15">15s</option>
                    <option value="20">20s</option>
                </select>
            </div>
        </div>

        <div class="progress-box"><div class="progress-bar" id="progressBar"></div></div>
        <div class="status-text" id="statusText" data-i18n="ready">آماده...</div>
    </div>

    <div class="grid">
        <div>
            <label class="io-label" for="inputProxies">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                <span data-i18n="inputLabel">لیست ورودی</span>
            </label>
            <textarea id="inputProxies" placeholder="..."></textarea>
            <div class="btn-row">
                <button class="btn-start" id="startBtn" onclick="handleStartStop()">شروع بررسی</button>
                <button class="btn-pause" id="pauseBtn" onclick="togglePause()" style="display:none">توقف موقت</button>
                <label class="btn-file">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    <span data-i18n="fileBtn">فایل</span>
                    <input type="file" id="fileInput" accept=".txt,.csv,.list" onchange="handleFileUpload(event)" style="display:none">
                </label>
            </div>
        </div>
        <div>
            <label class="io-label" for="outputProxies">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
                <span data-i18n="outputLabel">لیست سالم</span>
            </label>
            <textarea id="outputProxies" readonly placeholder="..."></textarea>
            <div class="btn-row">
                <button class="btn-copy" onclick="copyResults()">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    <span data-i18n="copyBtn">کپی لیست سالم</span>
                </button>
                <button class="btn-export" onclick="exportResults('txt')">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
                    <span data-i18n="exportTxtBtn">TXT</span>
                </button>
                <button class="btn-export" onclick="exportResults('json')">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
                    <span data-i18n="exportJsonBtn">JSON</span>
                </button>
            </div>
        </div>
    </div>

    <div class="debug-console" id="console">
        > System Ready.
    </div>
</div>

<div id="toast" class="toast"></div>

<script src="/js/script.js"></script>
</body>
</html>
