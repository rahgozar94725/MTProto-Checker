name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: linux
            arch: amd64
            ext: ''
          - os: linux
            arch: arm64
            ext: ''
          - os: darwin
            arch: amd64
            ext: ''
          - os: darwin
            arch: arm64
            ext: ''

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build
        run: |
          go build -ldflags="-X main.version=${{ github.ref_name }}" \
            -o mtproto-checker-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: mtproto-checker-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  # Release notes and publishing live in the shared workflow. It renders
  # cliff.toml from this repository at the tag being built, guards the result,
  # and creates the release with the artifacts uploaded above.
  #
  # Pinned by SHA, not by tag: a moving ref would let the workflow repository
  # repoint this project at code it never reviewed. The trailing comment says
  # which version that SHA is.
  release:
    needs: build
    uses: rahgozar94725/release-workflows/.github/workflows/release.yml@e17e401b6ffd76ba9ab7fffb59ea9a5ce0954711  # v2.0.0
    with:
      artifact-glob: 'binary-*/*'
