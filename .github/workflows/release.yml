name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: linux
            arch: amd64
            ext: ''
          - os: linux
            arch: arm64
            ext: ''
          - os: darwin
            arch: amd64
            ext: ''
          - os: darwin
            arch: arm64
            ext: ''

    runs-on: ubuntu-latest

    steps:
      # Pinned by SHA for the same reason as the reusable workflow below.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version-file: 'go.mod'

      # The orphan `snapshot` branch holds the nightly list and its checksum. It has to land
      # in public/data/ before the compiler runs, because //go:embed reads the working tree —
      # a release built without this step ships the committed placeholder instead.
      # --fail is what turns a deleted branch or a renamed file into a red job rather than
      # a silently placeholder-shipping release; without it curl saves the 404 body and
      # exits 0. Nothing is committed back: the overwrite lives in the runner's checkout.
      #
      # The checksum is fetched and verified before the file is accepted, so what ships is
      # attested to be what the nightly job produced rather than whatever answered the
      # request. It is not a signature and does not make the upstream sources trustworthy —
      # the drift guard in build-snapshot.mjs is what covers those.
      - name: Fetch the nightly snapshot
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/${{ github.repository }}/snapshot"
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/snapshot.txt" "$base/snapshot.txt"
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/snapshot.txt.sha256" "$base/snapshot.txt.sha256"
          ( cd "$RUNNER_TEMP" && sha256sum -c snapshot.txt.sha256 )
          cp "$RUNNER_TEMP/snapshot.txt" public/data/snapshot.txt

      - name: Build
        run: |
          go build -ldflags="-X main.version=${{ github.ref_name }}" \
            -o mtproto-checker-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: mtproto-checker-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  # Release notes and publishing live in the shared workflow. It renders
  # cliff.toml from this repository at the tag being built, guards the result,
  # and creates the release with the artifacts uploaded above.
  #
  # Pinned by SHA, not by tag: a moving ref would let the workflow repository
  # repoint this project at code it never reviewed. The trailing comment says
  # which version that SHA is.
  release:
    needs: build
    uses: rahgozar94725/release-workflows/.github/workflows/release.yml@e17e401b6ffd76ba9ab7fffb59ea9a5ce0954711  # v2.0.0
    with:
      artifact-glob: 'binary-*/*'
